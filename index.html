<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->

    <!-- CSS File -->

    <!-- Animate.css -->

<body>
    <header class="animate__animated animate__fadeInDown">
        <h1>Welcome to Sai Manaswini Kotla Portfolio</h1>

        <a href="#bio">About</a>
        <a href="#gallery">Gallery</a>

    <section id="bio">
        <h2>About</h2>

    </section>
    <section id="gallery">
        <h2>Photo Gallery</h2>
        <div class="gallery">
            <a href="IMG-20241127-WA0001.jpg" data-lightbox="gallery"><img src="IMG-20241127-WA0001.jpg" alt="Photo 1"></a>

    <section id="social-links">
        <h2>Connect</h2>
        <ul>
            <li><a href="https://www.instagram.com/lovely_kotla" target="_blank"><i class="fab fa-instagram"></i> Instagram</a></li>

        </ul>
    </section>
    <section id="contact">
        <h2>Contact</h2>
        <form action="https://formspree.io/f/xpwzylop" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2024 Sai Manaswini Kotla Portfolio</p>
    </footer>
    <!-- Smooth Scrolling Script -->
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
